server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS embebido de Docker. Sin esto, `proxy_pass http://backend:3100/`
    # resuelve el nombre UNA sola vez, al arrancar nginx -- si ese contenedor
    # todavía no está registrado en la red en ese milisegundo exacto (una
    # carrera real con `depends_on`, que solo espera a que el contenedor
    # "arranque", no a que su DNS esté listo), nginx truena con "host not
    # found in upstream" y no reintenta nunca, aunque el servicio sí suba
    # un segundo después. Con `resolver` + la URL en una variable, la
    # resolución se difiere a cuando llega el primer request, con reintento.
    resolver 127.0.0.11 valid=10s;

    # `proxy_pass` con el destino en una variable (necesario para el `resolver`
    # de arriba) deja de recortar solo el prefijo de la ubicación -- a
    # diferencia de un `proxy_pass` con la URL fija, ahí nginx no reenvía el
    # resto de la ruta como se esperaría; probado real, le llegaba "/" al
    # servicio en vez de p. ej. "/training/jobs". El `rewrite ... break` hace
    # ese recorte a mano antes del `proxy_pass`.
    location /api/ {
        set $backend_upstream http://backend:3100;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }

    # P2-52: agente del Copilot. Una respuesta puede encadenar varias rondas de
    # herramientas y llamadas al modelo, así que el timeout de lectura es mayor
    # que el default de nginx (60 s).
    location /copilot-api/ {
        set $copilot_upstream http://copilot:8000;
        rewrite ^/copilot-api/(.*)$ /$1 break;
        proxy_pass $copilot_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    # P3-03: ml-api (Training/Experiments/Evaluation/Models/Inference).
    location /ml-api/ {
        set $ml_api_upstream http://ml-api:8100;
        rewrite ^/ml-api/(.*)$ /$1 break;
        proxy_pass $ml_api_upstream;
        proxy_set_header Host $host;
    }

    # P2-22/23/24: reportes del gate (volumen compartido, ver docker-compose.yml).
    # Sin esto, el fallback de SPA de abajo convierte un reporte que todavía
    # no existe (p. ej. splits.json) en un 200 con index.html en vez de un
    # 404 real, y el frontend no puede distinguir "no existe" de "cargó mal".
    location /reports/ {
        disable_symlinks on;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
