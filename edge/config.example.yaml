# Plantilla sin secretos con los valores aprobados por el PM (#6). Copia a edge/config.yaml
# (ignorado por git) y ajusta. Las rutas relativas se resuelven contra la carpeta de este archivo.
device_id: edge-laptop-01

camera:
  index: 1            # laptop edge: la cámara USB suele ser 1; la webcam integrada, 0
  api: auto           # auto = DirectShow (cv2.CAP_DSHOW) en Windows
  width: null         # null = resolución nativa de la cámara (probablemente 640x480)
  height: null
  warmup_frames: 10   # cuadros descartados al abrir y antes de cada captura (autoexposición)

model:
  # ONNX FP32 de #4 (PR #17): reports/p4/conversion/parity_fp32.json. No va en git:
  # copia model_fp32.onnx a edge/models/. La versión final será 1.0.0-int8 (#4, parte 2).
  path: models/model_fp32.onnx
  version: 1.0.0-fp32
  sha256: "9163ecec60337d2953920ee2831ce40478c10050746c573b363e906a897031be"
  runtime: onnxruntime
  threads: null                        # null = lo que decida el runtime
  image_size: 128
  registry: null                       # opcional: ../models/edge_registry.json (#4)

# Cuadrado centrado con lado = 80% del lado menor del frame. Alternativas:
#   crop: null                                     (sin recorte)
#   crop: {x: 80, y: 0, width: 480, height: 480}   (píxeles fijos del frame)
crop:
  center_square: 0.8

capture:
  mode: manual          # manual (Enter) | interval
  interval_seconds: 10

data_dir: data          # captures.jsonl, images/ (frame completo), crops/ y edge.log

aws:
  bucket: ""            # lo usa el uploader (P4-09); la captura nunca toca la red
