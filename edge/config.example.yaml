# Plantilla sin secretos con los valores aprobados por el PM (#6). Copia a edge/config.yaml
# (ignorado por git) y ajusta. Las rutas relativas se resuelven contra la carpeta de este archivo.
device_id: edge-laptop-01

camera:
  # En Windows el orden de los índices cambia entre arranques (la USB fue 1 y luego 0), así que
  # se elige por nombre DirectShow (subcadena, sin distinguir mayúsculas). Con `name` definido,
  # `index` se ignora. Nombres en la laptop edge: "GENERAL WEBCAM" (USB, VID 1B3F) y
  # "USB2.0 UVC HD Webcam" (integrada). Lista los disponibles con: python -m edge cameras
  name: GENERAL WEBCAM
  index: 1            # solo si name: null
  api: auto           # auto = DirectShow (cv2.CAP_DSHOW) en Windows
  width: null         # null = resolución nativa de la cámara (probablemente 640x480)
  height: null
  warmup_frames: 10   # cuadros que se leen y descartan al abrir y antes de cada captura
  # Tiempo mínimo leyendo cuadros antes de capturar. Sin esto, tras cambiar la escena el primer
  # Enter devolvía el cuadro anterior (DirectShow guarda el último cuadro y grab() no espera).
  settle_seconds: 0.5

model:
  # Variante final de #4: ONNX INT8 estática (PR #22). No va en git: descarga model_int8.onnx
  # de S3 (models/edge_registry.json) a edge/models/. Al arrancar se verifica el SHA contra
  # esta config y contra model_sha256 del registro.
  path: models/model_int8.onnx
  version: 1.0.0-int8
  sha256: "dffa9cf2670f0f9bb96139ae08779e2ba3af87691791ad770061e3f666290392"
  runtime: onnxruntime
  threads: null                        # null = lo que decida el runtime
  image_size: 128
  registry: ../models/edge_registry.json   # null = solo se verifica contra sha256 de esta config

# Cuadrado centrado con lado = 80% del lado menor del frame. Alternativas:
#   crop: null                                     (sin recorte)
#   crop: {x: 80, y: 0, width: 480, height: 480}   (píxeles fijos del frame)
crop:
  center_square: 0.8

capture:
  mode: manual          # manual (Enter) | interval
  interval_seconds: 10

data_dir: data          # captures.jsonl, uploads.jsonl, images/ (frame completo), crops/ y edge.log

# Envío a S3 (P4-09). Tras clasificar, cada captura se sube en segundo plano: la captura y la
# inferencia nunca esperan a la red. bucket: "" = solo local. Sin credenciales en este archivo:
# el perfil SSO se renueva con `aws sso login --profile <perfil>` antes de cada sesión.
aws:
  bucket: mlops-p4-edge-captures-222629887955
  profile: mlops-p3     # nombre local libre; debe asumir el rol MLOpsP3. null = AWS_PROFILE
  region: us-east-1
