# P4-15: basic auth obligatorio en todo el portal desplegado en AWS.
# Se monta en conf.d (contexto http), así que cubre cada server y location.
auth_basic "Capturas Edge";
auth_basic_user_file /etc/nginx/portal.htpasswd;

# El puerto 80 está abierto a 0.0.0.0/0 (decisión de PM): límite de peticiones por IP
# para frenar la fuerza bruta contra el basic auth. Cargar el portal pide ~30 archivos a
# la vez (las imágenes de Capturas Edge van directo a S3), así que la ráfaga lo cubre.
limit_req_zone $binary_remote_addr zone=portal:10m rate=10r/s;
limit_req zone=portal burst=60 nodelay;
limit_req_status 429;
